plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.4.1'
}

group = 'com.banistmo'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '5.4.1'
    cucumberVersion = '8.0.4'
    junitVersion = '6.1.3'
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    testImplementation "org.junit.platform:junit-platform-suite:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"

    testImplementation 'org.assertj:assertj-core:3.27.6'
    testImplementation 'ch.qos.logback:logback-classic:1.5.20'
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'headless.mode', System.getProperty('headless.mode', 'false')
    systemProperty 'webdriver.driver', System.getProperty('webdriver.driver', 'chrome')

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

tasks.named('test') {
    finalizedBy 'aggregate'
}
