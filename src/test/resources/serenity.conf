webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 2000
    fluentwait = 15000
  }
}

headless.mode = false

serenity {
  project.name = "Banistmo Personas"
  take.screenshots = AFTER_EACH_STEP
  browser.maximized = true
  restart.browser.for.each = scenario
  logging = QUIET
  timeout = 30000
}

chrome.switches = "--window-size=1920,1080;--start-maximized;--disable-notifications;--disable-popup-blocking;--disable-dev-shm-usage;--remote-allow-origins=*;--disable-search-engine-choice-screen"

banistmo.personas.url = "https://www.banistmo.com/personas"
